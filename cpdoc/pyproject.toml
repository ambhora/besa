[project]
name = "cpdoc"
version = "0.1.0"
description = "Semantic, versioned API documentation generator"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "markdown-it-py>=3",
  "packaging>=24",
  "PyYAML>=6",
]

[project.scripts]
cpdoc = "cpdoc.cli:main"

[dependency-groups]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpdoc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
addopts = "-ra"
