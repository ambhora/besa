[project]
name = "properdocs-cpdoc"
version = "0.1.0"
description = "ProperDocs integration for cpdoc API references"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "cpdoc>=0.1.0",
  "properdocs>=1.6.7",
]

[tool.uv.sources]
cpdoc = { workspace = true }

[project.entry-points."properdocs.plugins"]
cpdoc = "properdocs_cpdoc.plugin:CpdocPlugin"

[dependency-groups]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/properdocs_cpdoc"]

[tool.pytest.ini_options]
pythonpath = ["src", "../cpdoc/src"]
testpaths = ["test"]
addopts = "-ra"
