# Build the ProperDocs site from docs/ and publish it to GitHub Pages. Pull requests only build,
# so a broken page fails the check without touching the published site. The repository's Pages
# source must be set to "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Build with ProperDocs
        run: uvx --with properdocs-theme-readthedocs properdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
