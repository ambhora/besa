[project]
name = "besa"
dynamic = ["version"]
description = "Declarative project development tooling for CMake and Python projects"
readme = "readme.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Jayesh Badwaik", email = "j.badwaik@fz-juelich.de" },
]
dependencies = []

[project.urls]
Documentation = "https://ambhora.github.io/besa/"
Source = "https://github.com/ambhora/besa"

[project.scripts]
besa = "besa.cli:main"

[dependency-groups]
test = [
  "build",
  "pytest",
]
docs = [
  "properdocs",
  "mkdocs-materialx",
]

# --------------------------------------------------------------------------------------------------
# Hatch configuration
# --------------------------------------------------------------------------------------------------

[tool.hatch.version]
path = "src/besa/metadata.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/besa"]

[tool.hatch.build.targets.wheel.shared-data]
"share" = "share"

# --------------------------------------------------------------------------------------------------
# PyTest configuration
# --------------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
addopts = "-ra"
markers = [
  "cpp: C++ template and CMake integration tests",
  "python: Python template tests",
]
