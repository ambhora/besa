[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "besa"
description = "Build-system support for BESA CMake projects"
dynamic = ["version"]
readme = "readme.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jayesh Badwaik", email = "j.badwaik@fz-juelich.de" }]
dependencies = []

[tool.hatch.version]
path = "src/besa/__init__.py"

[project.scripts]
besa = "besa.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/besa"]

[tool.hatch.build.targets.wheel.shared-data]
"share/besa/cmake" = "share/besa/cmake"

[tool.hatch.envs.default]
dependencies = ["pytest", "ruff"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests/python}"
lint = "ruff check src/besa tests/python"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
